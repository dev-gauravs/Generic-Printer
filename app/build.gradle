plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.jetbrains.kotlin.android)
    id "maven-publish"
}

def pomProperty = { String propertyName, String fallback ->
    def value = findProperty(propertyName)
    value == null ? fallback : value.toString()
}

android {
    namespace "com.kor.genericprinter"
    compileSdk 35

    defaultConfig {
        minSdk 21
        targetSdk 34
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    testImplementation libs.junit
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = project.group.toString()
                artifactId = pomProperty("POM_ARTIFACT_ID", "Generic-Printer")
                version = project.version.toString()

                pom {
                    name = pomProperty("POM_NAME", "GenericPrinter")
                    description = pomProperty(
                            "POM_DESCRIPTION",
                            "Lightweight ESC/POS Bluetooth and USB thermal printer SDK for Android."
                    )
                    url = pomProperty("POM_URL", "https://github.com/dev-gauravs/Generic-Printer")

                    licenses {
                        license {
                            name = pomProperty("POM_LICENSE_NAME", "MIT License")
                            url = pomProperty("POM_LICENSE_URL", "https://opensource.org/licenses/MIT")
                        }
                    }

                    developers {
                        developer {
                            id = pomProperty("POM_DEVELOPER_ID", "KundalikSuryawanshi")
                            name = pomProperty("POM_DEVELOPER_NAME", "Kundalik Suryawanshi")
                            email = pomProperty("POM_DEVELOPER_EMAIL", "gauravs7741@gmail.com")
                        }
                    }

                    scm {
                        url = pomProperty("POM_SCM_URL", "https://github.com/dev-gauravs/Generic-Printer")
                        connection = pomProperty(
                                "POM_SCM_CONNECTION",
                                "scm:git:git://github.com/dev-gauravs/Generic-Printer.git"
                        )
                        developerConnection = pomProperty(
                                "POM_SCM_DEV_CONNECTION",
                                "scm:git:ssh://github.com/dev-gauravs/Generic-Printer.git"
                        )
                    }
                }
            }
        }
    }
}
